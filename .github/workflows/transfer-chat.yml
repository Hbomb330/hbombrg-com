name: Transfer and Chat page

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-transfer-chat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check standalone product page
        run: python3 scripts/check-transfer-chat.py
