name: HB Transfer
on:
  pull_request:
    paths: ['prototypes/hb-transfer/**', '.github/workflows/hb-transfer.yml']
  push:
    branches: [main, 'feat/hb-transfer-prototype']
    paths: ['prototypes/hb-transfer/**', '.github/workflows/hb-transfer.yml']
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: prototypes/hb-transfer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/hb-transfer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/browser-smoke.mjs
