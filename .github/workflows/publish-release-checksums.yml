name: Publish existing release checksums
on:
  push:
    branches: [maintenance/publish-release-checksums]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download, verify and append checksum assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess, urllib.request
          releases = json.loads("[{\"id\":405904287,\"tag\":\"weather-v1.1.6\",\"assets\":[{\"id\":619064516,\"name\":\"HBOMB-Weather-1.1.6-Portable.zip\",\"size\":209696393,\"digest\":\"sha256:11a726108c945c97025a7e8a49394ca19031f830aaf03881d6cd36c740136743\",\"url\":\"https://github.com/Hbomb330/hbombrg-com/releases/download/weather-v1.1.6/HBOMB-Weather-1.1.6-Portable.zip\"}]},{\"id\":404499989,\"tag\":\"Notepad\",\"assets\":[{\"id\":614993493,\"name\":\"HBOMB.Notepad.1.3.0.exe\",\"size\":93441933,\"digest\":\"sha256:bd0cc3fcb3f6e4ad127501907d0811ae8acd7bef070d68d7ef019a6f0b53ed6a\",\"url\":\"https://github.com/Hbomb330/hbombrg-com/releases/download/Notepad/HBOMB.Notepad.1.3.0.exe\"},{\"id\":615001325,\"name\":\"HBOMB.Notepad.Setup.1.3.0.exe\",\"size\":93659800,\"digest\":\"sha256:9cae1e3ce612f51fb823532cf3c6c9ccef9abcf91f6d29c82dc918e610d0f6bc\",\"url\":\"https://github.com/Hbomb330/hbombrg-com/releases/download/Notepad/HBOMB.Notepad.Setup.1.3.0.exe\"}]},{\"id\":401549587,\"tag\":\"blue-wave-v2.1.0\",\"assets\":[{\"id\":604831705,\"name\":\"HBOMB.Blue.Wave.2.1.0.exe\",\"size\":340693343,\"digest\":\"sha256:eb77486d8de84175a11730865ae531e307e695a9085e70b01a5f0c340211beac\",\"url\":\"https://github.com/Hbomb330/hbombrg-com/releases/download/blue-wave-v2.1.0/HBOMB.Blue.Wave.2.1.0.exe\"}]}]")
          root = pathlib.Path("checksums")
          root.mkdir()
          for release in releases:
              folder = root / release["tag"]
              folder.mkdir()
              rows = []
              for asset in release["assets"]:
                  path = folder / asset["name"]
                  subprocess.run(["gh", "release", "download", release["tag"], "--repo", "Hbomb330/hbombrg-com", "--pattern", asset["name"], "--dir", str(folder)], check=True)
                  with path.open("rb") as stream:
                      digest = hashlib.file_digest(stream, "sha256").hexdigest()
                  assert path.stat().st_size == asset["size"], "Size mismatch"
                  assert "sha256:" + digest == asset["digest"], "Digest mismatch"
                  rows.append(digest + "  " + asset["name"] + "\n")
                  print("VERIFIED", asset["name"], digest, flush=True)
              (folder / "SHA256.txt").write_text("".join(rows), encoding="ascii")
          # All four binaries must verify before publishing anything.
          for release in releases:
              current = json.loads(subprocess.check_output(["gh", "api", "repos/Hbomb330/hbombrg-com/releases/" + str(release["id"])]))
              assert current["tag_name"] == release["tag"] and not current["draft"]
              for expected in release["assets"]:
                  actual = next(a for a in current["assets"] if a["id"] == expected["id"])
                  assert all(actual[k] == expected[k] for k in ("name", "size", "digest"))
              checksum = root / release["tag"] / "SHA256.txt"
              if any(a["name"] == "SHA256.txt" for a in current["assets"]):
                  raise RuntimeError("Existing SHA256.txt: refusing to overwrite")
              subprocess.run(["gh", "release", "upload", release["tag"], str(checksum), "--repo", "Hbomb330/hbombrg-com"], check=True)
              verify = root / release["tag"] / "readback"
              verify.mkdir()
              subprocess.run(["gh", "release", "download", release["tag"], "--repo", "Hbomb330/hbombrg-com", "--pattern", "SHA256.txt", "--dir", str(verify)], check=True)
              assert checksum.read_bytes() == (verify / "SHA256.txt").read_bytes()
              print("PUBLISHED AND READ BACK", release["tag"], flush=True)
          
          PY
