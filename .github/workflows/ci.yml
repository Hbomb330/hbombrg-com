name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check static bundle
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess
          import re

          expected = {
              "previews/blue-wave.svg",
              "previews/time-core.svg",
              "previews/weather.svg",
              "previews/notepad.svg",
          }

          class Page(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.previews = set()
                  self.downloads = {}
                  self.scripts = []
                  self.in_script = False

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "a" and "data-app-download" in attrs:
                      app = attrs["data-app-download"]
                      assert app not in self.downloads, f"Duplicate download: {app}"
                      self.downloads[app] = attrs
                  if tag == "script" and "src" not in attrs:
                      self.in_script = True
                      self.scripts.append("")
                  for value in attrs.values():
                      if value and value.startswith("previews/") and value.endswith(".svg"):
                          self.previews.add(value)

              def handle_data(self, data):
                  if self.in_script:
                      self.scripts[-1] += data

              def handle_endtag(self, tag):
                  if tag == "script":
                      self.in_script = False

          page = Page()
          page.feed(Path("index.html").read_text(encoding="utf-8"))
          page.close()
          assert not page.in_script, "Unclosed inline script"
          assert page.previews == expected, f"Preview references differ: {page.previews ^ expected}"
          for preview in expected:
              assert Path(preview).is_file(), f"Missing preview: {preview}"
          assert page.scripts, "No inline scripts found"
          config = next(s for s in page.scripts if "window.HBOMB_APP_CONFIG =" in s)
          configured_downloads = dict(re.findall(r'"([a-z-]+)": \{[^\n]*downloadUrl: "([^"]+)"', config))
          assert set(configured_downloads) == {"blue-wave", "time-core", "weather", "notepad"}, "App config not found"
          for app, url in configured_downloads.items():
              if not url:
                  continue
              link = page.downloads.get(app, {})
              assert link.get("href") == url, f"Static download differs from config: {app}"
              assert link.get("aria-disabled") != "true", f"Static download disabled: {app}"
              assert "disabled" not in link.get("class", "").split(), f"Static download styled disabled: {app}"
          print("Static download links match published app configuration")
          for number, script in enumerate(page.scripts, 1):
              result = subprocess.run(["node", "--check"], input=script, text=True, capture_output=True)
              assert result.returncode == 0, f"Inline script {number}: {result.stderr}"
          print(f"HTML parsed; {len(page.scripts)} inline scripts and {len(expected)} previews checked")
          PY
